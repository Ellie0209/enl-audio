<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shadow &amp; Shine Daily</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2F5D8A">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#FBF8F2;--card:#fff;--ink:#22252B;--mut:#6B6F78;--line:#E6E1D6;--brand:#2F5D8A}
@media (prefers-color-scheme:dark){:root{--bg:#16181C;--card:#1F2228;--ink:#ECEDEF;--mut:#A3A7AF;--line:#30343B;--brand:#6F9FD0}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;padding:24px 16px}
.card{max-width:420px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 22px;text-align:center}
.logo{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--brand);color:#fff;font-size:28px}
h1{font-size:20px;margin:14px 0 6px}
p{color:var(--mut);margin:0 0 20px}
a.btn{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:12px 20px}
footer{margin-top:18px;font-size:11px;color:var(--mut)}
</style>
</head>
<body>
<main class="card">
  <span class="logo" aria-hidden="true">☀︎</span>
  <h1>Shadow &amp; Shine Daily는 이제<br>E&amp;Languages 회원 앱에서 이용해요</h1>
  <p>매일 새 지문, 원어민 오디오, 녹음, 워크시트를 회원 앱에서 만나 보세요.</p>
  <a class="btn" href="https://e-languages.vercel.app/shadow-daily">회원 앱으로 가기 →</a>
  <footer>© 2026 Ellie. For classroom use only. No part of this material may be copied or distributed without permission.</footer>
</main>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { if (k.indexOf("ssd-") === 0) caches.delete(k); }); }).catch(function () {});
</script>
</body>
</html>
