name: Korean TTS samples
on:
  push:
    paths: ['tools/ko_samples.py', '.github/workflows/ko-samples.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q edge-tts supertonic soundfile numpy
      - run: python tools/ko_samples.py
      - name: Commit samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples/ko
          git commit -m "Korean TTS samples [skip ci]" || echo "nothing to commit"
          git pull --rebase -q origin main && git push -q origin HEAD:main
