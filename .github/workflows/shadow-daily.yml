name: Shadow & Shine Daily publication
on:
  push:
    branches: [main]
    paths: ['shadow/daily/d*/scripts.json', 'tools/daily/**', '.github/workflows/shadow-daily.yml']
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild all existing audio and worksheets
        type: boolean
        required: false
        default: false
permissions:
  contents: write
  pages: write
concurrency:
  group: shadow-daily
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/daily/requirements-build.txt
      - name: Install audio, PDF and Korean font dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-noto-cjk fonts-dejavu-core
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q -r tools/daily/requirements-build.txt
          python -m playwright install --with-deps chromium
      - name: Build, validate and publish complete assets
        id: publish
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          args=()
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python tools/daily/publish_daily.py "${args[@]}"
      - name: Request Pages build for the published main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null
      - name: Verify the public catalog, scripts and all latest assets
        run: |
          git fetch origin main
          git reset --hard FETCH_HEAD
          python tools/daily/check_daily.py --latest --wait 600
      - name: Record publication outcome
        if: always()
        env:
          RESULT: ${{ job.status }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.published_sha }}
        run: |
          {
            echo '## Daily publication'
            echo "- Result: $RESULT"
            echo "- Published commit: ${PUBLISHED_SHA:-not published}"
            echo '- New passages must be supplied by the external content job; this workflow does not write new passages.'
          } >> "$GITHUB_STEP_SUMMARY"
