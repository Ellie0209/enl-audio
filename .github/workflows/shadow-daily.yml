name: Shadow & Shine Daily audio (Kokoro)
on:
  push:
    branches: [main]
    paths: ['shadow/daily/d*/scripts.json', 'tools/daily/build_audio.py', '.github/workflows/shadow-daily.yml']
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild every day (true/false)'
        required: false
        default: 'false'
permissions:
  contents: write
concurrency:
  group: shadow-daily
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" soundfile numpy
      - run: python tools/daily/build_audio.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      - run: python tools/daily/build_pages.py
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadow/daily index.html
          git commit -q -m "Shadow & Shine Daily audio (Kokoro af_heart / bf_emma) [skip ci]" || echo "nothing to commit"
          git pull --rebase -q origin main && git push -q origin HEAD:main
